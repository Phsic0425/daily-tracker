<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6366F1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="日常记账">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>日常记账</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- 顶部 -->
    <header class="header">
      <div class="header-left">
        <h1 class="header-title">📒 日常记账</h1>
      </div>
      <div class="header-right">
        <button class="btn-month" id="btnPrevMonth" title="上月">◀</button>
        <input type="month" id="monthPicker" class="header-month-input" title="选择月份">
        <button class="btn-month" id="btnNextMonth" title="下月">▶</button>
      </div>
    </header>

    <!-- 标签栏 -->
    <nav class="tabs">
      <button class="tab active" data-tab="expense">
        <span class="tab-icon">💰</span><span>记账</span>
      </button>
      <button class="tab" data-tab="todo">
        <span class="tab-icon">✅</span><span>待办</span>
        <span class="tab-badge" id="todoBadge">0</span>
      </button>
    </nav>

    <!-- 主内容 -->
    <main class="main">

      <!-- ====== 记账页面 ====== -->
      <section class="tab-content active" id="tabExpense">
        <!-- 月度汇总卡片 -->
        <div class="summary-row">
          <div class="summary-card income">
            <span class="summary-label">收入</span>
            <span class="summary-value" id="sumIncome">¥0</span>
          </div>
          <div class="summary-card expense">
            <span class="summary-label">支出</span>
            <span class="summary-value" id="sumExpense">¥0</span>
          </div>
          <div class="summary-card balance">
            <span class="summary-label">结余</span>
            <span class="summary-value" id="sumBalance">¥0</span>
          </div>
        </div>

        <!-- 快捷模板 -->
        <div class="section" id="templateSection">
          <div class="section-header">
            <span>⚡ 快捷模板</span>
            <button class="btn btn-sm btn-tpl-manage" id="btnTplManage" onclick="toggleTemplateManage()">管理</button>
          </div>
          <div class="template-scroll" id="templateList">
            <p class="empty-hint" id="templateEmpty">暂无模板，记一笔时可保存为模板</p>
          </div>
        </div>

        <!-- 分类统计 -->
        <div class="section">
          <div class="section-header">
            <span>📊 分类统计</span>
          </div>
          <div class="category-list" id="categoryBreakdown">
            <p class="empty-hint">本月暂无记录</p>
          </div>
        </div>

        <!-- 账单列表 -->
        <div class="section">
          <div class="section-header">
            <span>📋 账单明细</span>
            <button class="btn btn-sm btn-batch-del" id="btnBatchDel" onclick="toggleBatchDelete()">批量删除</button>
          </div>
          <div class="batch-actions" id="batchActions" style="display:none">
            <button class="btn btn-sm btn-primary" id="btnSelectAll">全选</button>
            <button class="btn btn-sm" id="btnDeleteSelected" style="background:#F43F5E;color:#fff">删除选中</button>
            <span class="batch-count" id="batchCount">已选 0 条</span>
          </div>
          <div class="expense-list" id="expenseList">
            <p class="empty-hint">暂无记录，点右下角 + 记一笔吧</p>
          </div>
        </div>
      </section>

      <!-- ====== 待办页面 ====== -->
      <section class="tab-content" id="tabTodo">
        <!-- 添加待办 -->
        <form class="todo-form" id="todoForm">
          <input type="text" class="input" id="todoTitle" placeholder="输入待办事项..." required autocomplete="off">
          <div class="todo-form-row">
            <input type="date" class="input" id="todoStartDate" title="开始日期（选填）">
            <span class="date-sep">→</span>
            <input type="date" class="input" id="todoDeadline" required title="截止日期">
          </div>
          <div class="todo-form-row">
            <select class="input" id="todoPriority">
              <option value="high">🔴 高优先</option>
              <option value="medium" selected>🟡 中优先</option>
              <option value="low">🟢 低优先</option>
            </select>
            <button type="submit" class="btn btn-primary">添加</button>
          </div>
        </form>

        <!-- 进行中 -->
        <div class="section">
          <div class="section-header">
            <span>📌 进行中</span>
            <span class="section-count" id="activeCount">0</span>
          </div>
          <div class="todo-list" id="activeTodoList">
            <p class="empty-hint">没有待办，添加一个吧</p>
          </div>
        </div>

        <!-- 已完成 -->
        <div class="section">
          <div class="section-header collapsible" id="completedHeader">
            <span>✅ 已完成</span>
            <span class="section-count" id="completedCount">0</span>
            <span class="collapse-arrow">▼</span>
          </div>
          <div class="todo-list" id="completedTodoList"></div>
        </div>
      </section>
    </main>

    <!-- 浮动添加按钮 -->
    <button class="fab" id="fabAdd" title="记一笔">+</button>

    <!-- 记账弹窗（底部弹出） -->
    <div class="overlay" id="overlay"></div>
    <div class="modal" id="expenseModal">
      <div class="modal-handle"></div>
      <h3 class="modal-title">记一笔</h3>

      <!-- 收支类型切换 -->
      <div class="type-toggle">
        <button class="type-btn active" data-type="expense">🔴 支出</button>
        <button class="type-btn" data-type="income">🟢 收入</button>
      </div>

      <!-- 金额 -->
      <div class="amount-input-wrapper">
        <span class="currency">¥</span>
        <input type="number" class="amount-input" id="inputAmount"
               placeholder="0.00" step="0.01" min="0.01" inputmode="decimal">
        <input type="file" accept="image/*" capture="environment" id="inputImage" class="image-input-hidden">
        <button type="button" class="btn-camera" id="btnCamera" title="拍照/上传截图">📷</button>
      </div>

      <!-- 截图预览 -->
      <div class="img-preview-box" id="imgPreviewBox" style="display:none">
        <img id="imgPreview" src="" alt="截图">
        <button type="button" class="img-remove-btn" id="btnRemoveImg">✕ 移除</button>
        <span class="img-hint">👆 对照截图输入金额</span>
      </div>

      <!-- 分类选择 -->
      <div class="category-grid" id="categoryGrid"></div>

      <!-- 日期与备注 -->
      <div class="form-row">
        <input type="date" class="input" id="inputDate">
        <input type="text" class="input" id="inputNote" placeholder="备注（选填）" maxlength="50">
      </div>

      <!-- 按钮 -->
      <label class="tpl-check-label" id="tplCheckLabel">
        <input type="checkbox" id="chkSaveTemplate"> 同时保存为快捷模板
      </label>
      <button class="btn btn-primary btn-block" id="btnSave">保存</button>
      <button class="btn btn-ghost btn-block" id="btnCancel">取消</button>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- 安装提示 -->
    <div class="install-banner" id="installBanner" style="display:none">
      <span>📱 添加到主屏幕，随时记账</span>
      <button class="btn btn-sm btn-primary" id="btnInstall">安装</button>
      <button class="btn btn-sm btn-ghost" id="btnDismissInstall">✕</button>
    </div>

    <!-- 更多菜单按钮 -->
    <button class="btn-more" id="btnMore" title="更多">⋯</button>
    <div class="more-menu" id="moreMenu" style="display:none">
      <button class="more-item" id="btnShowReport">📊 报表</button>
      <button class="more-item" id="btnInstallEntry">📱 安装应用</button>
    </div>

    <!-- 报表弹窗 -->
    <div class="overlay" id="reportOverlay"></div>
    <div class="modal" id="reportModal">
      <div class="modal-handle"></div>
      <h3 class="modal-title">📊 财务报告</h3>
      <div class="report-content" id="reportContent"></div>
      <button class="btn btn-ghost btn-block" id="btnCloseReport">关闭</button>
    </div>

    <!-- 完成特效 -->
    <div class="confetti-container" id="confettiContainer"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/expense.js"></script>
  <script src="js/todo.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/report.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/events.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
